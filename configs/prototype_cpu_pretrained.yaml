# Pretrained-ready configuration for the real Animate Anyone path.
#
# This file is intentionally kept separate from the tiny random-prototype config
# so the study prototype continues to work without downloads. It switches the
# VAE and CLIP modules to pretrained Hugging Face checkpoints and keeps the
# config contract aligned with the model width used by the CLIP projection.
#
# Usage:
#   python scripts/run_prototype.py --config configs/prototype_cpu_pretrained.yaml
#
# Important: this still requires the actual pretrained weights and a machine with
# enough memory to load them. The model is not shipped in this repo.

input:
  ref_height: 96
  ref_width: 96
  frames: 8

vae:
  mode: pretrained
  pretrained_id: stabilityai/sd-vae-ft-mse
  block_out_channels: [128, 256, 512, 512]
  latent_channels: 4
  layers_per_block: 2
  norm_num_groups: 32
  sample_size: 512
  scaling_factor: 0.18215
  decode_framewise: true
  dtype: null

clip:
  mode: pretrained
  pretrained_id: openai/clip-vit-base-patch32
  hidden_size: 768
  intermediate_size: 3072
  num_hidden_layers: 12
  num_attention_heads: 12
  image_size: 224
  patch_size: 32
  projection_dim: 512
  use_null_embedding: true

unet:
  in_channels: 4
  base_channels: [32, 64, 64]
  heads: 4
  context_dim: 512
  time_embed_dim: 128
  zero_init_out: false

pose_guider:
  block_out_channels: [16, 32, 64, 128]
  out_channels: 32
  zero_init_out: false

reference_net:
  base_channels: [32, 64, 64]
  heads: 4
  store_all_blocks: true

motion:
  enabled: true
  levels: [0, 1]
  mid_block: false
  heads: 4
  max_frames: 32
  zero_init_out: true

diffusion:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: linear
  steps_offset: 1
  prediction_type: epsilon
  num_inference_steps: 8
  guidance_scale: 3.5
  use_cfg: true
  eta: 0.0

runtime:
  device: auto
  dtype: float32
  seed: 1234
  use_reference: true
  use_clip: true
  use_pose: true
  use_temporal: true
  pose_fusion: add
  reference_attention_strength: 1.0
  log_shapes: true

output_dir: outputs/run_pretrained
